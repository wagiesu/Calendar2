name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android SDK commandline tools
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $HOME

          # Update this version if needed
          CMDLINE_TOOLS_VERSION=9477386_latest
          curl -sSL -o commandlinetools.zip "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}.zip"
          unzip -q commandlinetools.zip
          # normalize extracted folder to cmdline-tools/latest
          if [ -d "cmdline-tools" ]; then
            mv cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          else
            mv tools $ANDROID_SDK_ROOT/cmdline-tools/latest || true
          fi
          rm -f commandlinetools.zip

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Install Android SDK packages & accept licenses
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$HOME/android-sdk}
          mkdir -p $ANDROID_SDK_ROOT/licenses
          # Accept licenses non-interactively
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses || true

          # Install required platform / build-tools. Adjust versions to match your project.
          sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Create local.properties pointing to the SDK
        run: |
          echo "sdk.dir=$HOME/android-sdk" > local.properties
          cat local.properties

      - name: Build APKs
        run: |
          # Adjust gradle assemble tasks to match your modules/flavors
          ./gradlew :app:assembleCoreDebug :app:assembleFossDebug :app:assembleGplayDebug -x lint --no-daemon --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
